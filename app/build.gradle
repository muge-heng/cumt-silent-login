plugins {
    id 'com.android.application'
}

android {
    namespace 'com.muge.cumtsilent'
    compileSdk 34

    defaultConfig {
        applicationId "com.muge.cumtsilent"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            // 交付自用的无感登录 APK：debug 签名即可安装，保持简单。
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 仅使用 Android 框架 API：HttpURLConnection + org.json，零第三方依赖。
